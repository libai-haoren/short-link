server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: shortlink-admin
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/shortlink?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 3000
      idle-timeout: 600000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 200ms

# ---------------------------------------------------------------------
# 短链业务配置
# ---------------------------------------------------------------------
shortlink:
  # 短链域名兜底：t_domain 查不到时用它拼短链。生产上应由 t_domain 决定
  short-domain: ${SHORT_DOMAIN:s.example.com}
  codec:
    # FPE 密钥。泄露等于短码可预测，生产必须放配置中心并支持轮换。
    key: ${CODEC_KEY:905197557613}
  idgen:
    biz-tag: short_code
    step: 1000
  bloom:
    # 布隆容量：影响误判率，扩容需重建（见设计文档 5.3）
    expected-elements: ${BLOOM_CAPACITY:10000000}
  admin:
    cache:
      # 写 Redis 失败的重试次数；最终失败会打点告警，靠重建接口恢复
      write-retry: 3
    auth:
      # V4 占位账号：生产必须换成用户表 + BCrypt。这里存的是口令的 SHA-256，不是明文
      username: ${ADMIN_USERNAME:admin}
      password-sha256: ${ADMIN_PASSWORD_SHA256:240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9}
      user-id: 1
  jwt:
    # 与 gateway 共用；少于 32 字节会直接启动失败（HS256 的硬要求）
    secret: ${JWT_SECRET:shortlink-dev-secret-please-change-in-production-0123456789}
    issuer: shortlink
    ttl: 2h

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /doc.html

management:
  endpoints:
    web:
      exposure:
        # prometheus 端点等 V4 引入 micrometer-registry-prometheus 后再加
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
